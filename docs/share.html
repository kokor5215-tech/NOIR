<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Nonton di Noir</title>
    <meta property="og:title" content="Buka di Aplikasi Noir 🚀" />
    <meta property="og:description" content="Klik link ini untuk langsung menonton film/series pilihanmu atau mendownload aplikasi Noir secara gratis!" />
    <meta property="og:image" content="" />
    
    <script>
        window.onload = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var data = urlParams.get('data');
            
            if (data) {
                // 1. Coba tendang paksa ke aplikasi Noir
                window.location.href = "noirshare://" + data;
                
                // 2. Jika dalam 2 detik aplikasi tidak terbuka (karena belum diinstal), 
                //    tendang dia ke halaman download GitHub kamu!
                setTimeout(function() {
                    window.location.href = "https://github.com/USERNAME_KAMU/REPO_KAMU/releases/latest";
                }, 2000);
            } else {
                window.location.href = "https://github.com/USERNAME_KAMU/REPO_KAMU/releases/latest";
            }
        }
    </script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #121212; color: white; }
        a { color: #00d2ff; text-decoration: none; font-weight: bold; }
    </style>
</head>
