# ============================================================
# NOIR — Build & Rilis APK otomatis (L2 Update Pipeline)
# Push tag vX.Y.Z  →  APK dibuild  →  masuk Releases  →
# app Noir di HP mengecek & memasang update SENDIRI.
# ============================================================
name: Build Noir APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi (contoh: 1.3.2)'
        required: true
        default: '1.3.2'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-noir-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-noir-gradle-

      - name: Tentukan versi
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      # Signing release dari Secrets (WAJIB sama dengan kunci APK pertama,
      # kalau tidak update tidak bisa menimpa instalasi lama).
      - name: Decode keystore
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > noir.keystore
            echo "KS_PATH=$GITHUB_WORKSPACE/noir.keystore" >> $GITHUB_ENV
          fi
        env:
          KS_B64: ${{ secrets.NOIR_KEYSTORE_BASE64 }}

      - name: Build APK (release bila ada keystore, kalau tidak debug)
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            echo "Belum ada Secrets keystore — build debug (lihat README)."
            ./gradlew assembleDebug --no-daemon
          fi
        env:
          KEYSTORE_PATH: ${{ env.KS_PATH }}
          KEY_STORE_PASSWORD: ${{ secrets.NOIR_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.NOIR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOIR_KEY_PASSWORD }}
          UPDATE_GITHUB_USER: ${{ github.repository_owner }}
          UPDATE_GITHUB_REPO: ${{ github.event.repository.name }}

      # InAppUpdater membaca versi dari NAMA FILE: harus X.Y.Z.apk
      - name: Rename sesuai versi
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/Noir-${{ steps.ver.outputs.TAG }}.apk 2>/dev/null || \
          cp app/build/outputs/apk/debug/*.apk out/Noir-${{ steps.ver.outputs.TAG }}.apk

      - name: Publikasi ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.TAG }}
          files: out/Noir-${{ steps.ver.outputs.TAG }}.apk
          generate_release_notes: true
